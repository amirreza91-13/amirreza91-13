name: Profile quality

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "banner.svg"
      - "logo.svg"
      - "assets/**"
      - "scripts/check-profile.mjs"
      - ".github/workflows/profile-quality.yml"
  pull_request:
    paths:
      - "README.md"
      - "banner.svg"
      - "logo.svg"
      - "assets/**"
      - "scripts/check-profile.mjs"
      - ".github/workflows/profile-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-profile:
    name: Validate README and visual assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check profile assets and links
        run: node scripts/check-profile.mjs
