
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="535" viewBox="0 0 1200 535" role="img" aria-labelledby="t d">
<title id="t">Frostbyte technology constellation</title>
<desc id="d">Locally stored vector icons for Python, JavaScript, TypeScript, React, Node.js, Vite, Git, n8n, Django, SQLite, Streamlit and VS Code, presented as icy glass tiles.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#F4FBFF"/>
    <stop offset=".35" stop-color="#284D70"/>
    <stop offset="1" stop-color="#0A1A2D"/>
  </linearGradient>

  <linearGradient id="tile">
    <stop stop-color="#FFFFFF" stop-opacity=".25"/>
    <stop offset="1" stop-color="#9EDFFF" stop-opacity=".07"/>
  </linearGradient>

  <filter id="g">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- Background -->
<rect width="1200" height="535" rx="26" fill="url(#bg)"/>

<!-- Heading -->
<g font-family="Arial,Helvetica,sans-serif">
  <text x="42" y="52" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="3">LANGUAGES / FRAMEWORKS / ENGINEERING</text>
</g>

